name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: context_rot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d context_rot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Run tests against migrated PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/context_rot_test
        run: python -m pytest -q
      - name: Run detection-quality baseline
        run: python -m evaluation --json > evaluation-report.json
      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: detection-quality-report
          path: backend/evaluation-report.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t context-rot-detector-backend backend
      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t context-rot-detector-frontend frontend
